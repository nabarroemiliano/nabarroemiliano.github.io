{{ define "main" }}
<div class="w-full md:w-4/5 lg:w-3/4 xl:w-2/3 mx-auto px-4 sm:px-6 py-12">
    <article class="max-w-4xl mx-auto">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
        {{ if eq .Section "blogs" }}
            <div class="flex flex-wrap items-center gap-4 mb-10 text-text-secondary-light dark:text-text-secondary-dark">
                <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
                <div class="flex flex-wrap gap-2">
                    {{ range .Params.tags }}
                    <span class="px-2 py-1 bg-bg-primary-light dark:bg-bg-tertiary-dark border border-border-primary-light dark:border-border-primary-dark rounded-md text-xs font-medium text-text-secondary-light dark:text-text-secondary-dark">{{ . }}</span>
                    {{ end }}
                </div>
            </div>
        {{ end }}

        <div class="blog-content prose max-w-none">
            {{ .Content }}
        </div>
    </article>
</div>

<style>
    .blog-content {
        color: #4b5563;
        line-height: 1.75;
        font-size: 1.0625rem;
    }
    html.dark .blog-content {
        color: #d1d5db;
    }
    .blog-content h2 {
        color: #111827;
        font-size: 1.75rem;
        font-weight: 700;
        margin-top: 2.5rem;
        margin-bottom: 1rem;
        line-height: 1.3;
    }
    html.dark .blog-content h2 {
        color: #f3f4f6;
    }
    .blog-content p {
        margin-bottom: 1.25rem;
    }
    .blog-content ul {
        margin: 0 0 1.25rem 1.25rem;
        list-style: disc;
    }
    .blog-content li {
        margin-bottom: 0.5rem;
    }
    .blog-content strong {
        color: #111827;
        font-weight: 600;
    }
    html.dark .blog-content strong {
        color: #f9fafb;
    }
    .blog-content a {
        color: #2563eb;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
    }
    html.dark .blog-content a {
        color: #60a5fa;
    }
    .blog-content pre {
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        padding: 1rem 1.25rem;
        overflow-x: auto;
        margin: 1.5rem 0;
        font-size: 0.9rem;
        line-height: 1.6;
    }
    html.dark .blog-content pre {
        background: #1f2937;
        border-color: #374151;
    }
    .blog-content pre code {
        background: transparent;
        padding: 0;
        font-size: inherit;
        color: #111827;
    }
    html.dark .blog-content pre code {
        color: #e5e7eb;
    }
    .blog-content :not(pre) > code {
        background: #f3f4f6;
        border-radius: 0.25rem;
        padding: 0.15rem 0.4rem;
        font-size: 0.9em;
        color: #111827;
    }
    html.dark .blog-content :not(pre) > code {
        background: #374151;
        color: #e5e7eb;
    }
</style>
{{ end }}
