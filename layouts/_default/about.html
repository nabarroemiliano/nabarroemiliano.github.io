{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 py-12">
    <h1 class="text-5xl font-bold mb-6 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>

    <div class="flex flex-col gap-8">
        <div class="flex-grow">
            <div class="bg-bg-primary-light dark:bg-bg-secondary-dark p-8 rounded-lg mb-8 border border-border-primary-light dark:border-border-primary-dark">
                <div class="prose prose-invert prose-xl max-w-none">
                    <div>
                        {{ .Content }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .prose {
        color: #4b5563; /* text-secondary-light */
        font-size: 1.125rem;
    }
    html.dark .prose {
        color: #9ca3af; /* text-secondary-dark */
    }
    .prose h2 {
        color: #111827; /* text-primary-light */
        font-size: 1.375rem;
        font-weight: 700;
        margin-top: 1.75rem;
        margin-bottom: 0.75rem;
        line-height: 1.3;
    }
    html.dark .prose h2 {
        color: #f3f4f6; /* text-primary-dark */
    }
    .prose h2:first-child {
        margin-top: 0;
    }
    .prose p {
        color: #4b5563; /* text-secondary-light */
        margin-bottom: 1.5rem; /* Corresponds to mb-6 */
        line-height: 1.9;
    }
    html.dark .prose p {
        color: #9ca3af; /* text-secondary-dark */
    }
    .prose p + p {
        margin-top: 2rem;
    }
    .prose a {
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
        color: #2563eb;
    }
    html.dark .prose a {
        color: #60a5fa;
    }
</style>
{{ end }}
